name: Keep Render Service Alive

on:
  schedule:
    # Requested one-minute interval; GitHub may not schedule more frequently than every 5 minutes.
    - cron: "* * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-alive.yml"

permissions:
  contents: read

concurrency:
  group: keep-render-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Campromax on Render
        run: |
          set -eu
          URL="https://campromax.onrender.com/"
          echo "Pinging $URL"
          curl --fail --silent --show-error \
            --location \
            --max-time 50 \
            --retry 2 \
            --retry-delay 5 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            "$URL"
